<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>練習レビュー</title>
<style>
:root {
  --bg: #0f0f0f; --surface: #1a1a1a; --surface2: #252525;
  --border: #333; --text: #e0e0e0; --text2: #888;
  --accent: #4fc3f7; --good: #66bb6a; --issue: #ef5350; --comment: #ffa726;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
.container { max-width: 960px; margin: 0 auto; padding: 12px; }

/* Header */
.header { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.header h1 { font-size: 18px; font-weight: 600; }
.back-btn { color: var(--accent); text-decoration: none; font-size: 14px; }

/* Session list */
.session-list { display: flex; flex-direction: column; gap: 8px; }
.session-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; cursor: pointer; transition: border-color 0.15s; }
.session-card:hover { border-color: var(--accent); }
.session-card .title { font-weight: 600; font-size: 15px; }
.session-card .meta { color: var(--text2); font-size: 13px; margin-top: 2px; }
.session-card .status { display: inline-block; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-left: 8px; }
.session-card .status.processed { background: rgba(102,187,106,0.15); color: var(--good); }
.session-card .status.pending { background: rgba(255,167,38,0.15); color: var(--comment); }

/* Player view */
#player-view { display: none; }
.player-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.player-header h2 { font-size: 16px; }
.btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.15s; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #000; border-color: var(--accent); }
.btn.primary:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Waveform */
#waveform { background: var(--surface); border-radius: 8px; margin-bottom: 8px; min-height: 100px; }

/* Transport controls */
.transport { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.transport .time { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 14px; color: var(--accent); min-width: 80px; }
.skip-btn { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; }

/* Segments */
.segments-section { margin-bottom: 20px; }
.segments-section h3 { font-size: 14px; color: var(--text2); margin-bottom: 8px; }
.segment-row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 4px; cursor: pointer; transition: border-color 0.15s; }
.segment-row:hover, .segment-row.active { border-color: var(--accent); }
.segment-row .num { color: var(--text2); font-size: 12px; min-width: 28px; }
.segment-row .seg-title { flex: 1; font-size: 13px; }
.segment-row .seg-title input { background: transparent; border: none; color: var(--text); font-size: 13px; width: 100%; outline: none; }
.segment-row .seg-title input:focus { border-bottom: 1px solid var(--accent); }
.segment-row .seg-time { font-family: monospace; font-size: 12px; color: var(--text2); }

/* Annotations */
.annotations-section { margin-bottom: 20px; }
.annotations-section h3 { font-size: 14px; color: var(--text2); margin-bottom: 8px; }
.annotation { display: flex; gap: 8px; padding: 8px 12px; background: var(--surface); border-radius: 6px; margin-bottom: 4px; align-items: flex-start; border-left: 3px solid var(--comment); }
.annotation.good { border-left-color: var(--good); }
.annotation.issue { border-left-color: var(--issue); }
.annotation .ann-time { font-family: monospace; font-size: 12px; color: var(--accent); cursor: pointer; min-width: 50px; flex-shrink: 0; margin-top: 2px; }
.annotation .ann-time:hover { text-decoration: underline; }
.annotation .ann-body { flex: 1; }
.annotation .ann-user { font-size: 11px; color: var(--text2); }
.annotation .ann-content { font-size: 13px; }
.annotation .ann-delete { color: var(--text2); cursor: pointer; font-size: 12px; opacity: 0.5; }
.annotation .ann-delete:hover { opacity: 1; color: var(--issue); }

/* Add annotation form */
.add-annotation { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
.add-annotation input, .add-annotation select { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 13px; }
.add-annotation input:focus, .add-annotation select:focus { outline: none; border-color: var(--accent); }
.add-annotation input[name="content"] { flex: 1; min-width: 200px; }
.add-annotation input[name="user_name"] { width: 100px; }

/* Google Auth */
.auth-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.auth-bar .auth-status { font-size: 13px; color: var(--text2); }
.auth-bar .auth-status.ok { color: var(--good); }

/* New session / Drive browser */
.new-session-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; display: none; }
.new-session-panel h3 { font-size: 15px; margin-bottom: 12px; }
.drive-file-list { max-height: 300px; overflow-y: auto; }
.drive-file { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 4px; cursor: pointer; transition: border-color 0.15s; }
.drive-file:hover { border-color: var(--accent); }
.drive-file.selected { border-color: var(--accent); background: rgba(79,195,247,0.08); }
.drive-file .file-icon { font-size: 18px; }
.drive-file .file-info { flex: 1; }
.drive-file .file-name { font-size: 13px; font-weight: 500; }
.drive-file .file-meta { font-size: 11px; color: var(--text2); }
.drive-folder { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 4px; cursor: pointer; background: var(--surface2); font-size: 13px; }
.drive-folder:hover { border-color: var(--accent); }
.drive-breadcrumb { display: flex; gap: 4px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; font-size: 12px; color: var(--text2); }
.drive-breadcrumb span { cursor: pointer; color: var(--accent); }
.drive-breadcrumb span:hover { text-decoration: underline; }

/* Progress bar */
.progress-container { margin: 12px 0; display: none; }
.progress-bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.3s; width: 0%; }
.progress-text { font-size: 12px; color: var(--text2); margin-top: 4px; }

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--text2); }

/* Responsive */
@media (max-width: 600px) {
  .transport { gap: 4px; }
  .segment-row { padding: 6px 8px; }
}
</style>
</head>
<body>
<div class="container">
  <!-- Auth bar -->
  <div class="auth-bar" id="auth-bar">
    <span class="auth-status" id="auth-status">Google Drive 未接続</span>
    <button class="btn primary" id="auth-btn" onclick="handleAuth()">Google でログイン</button>
    <span style="flex:1"></span>
    <input type="text" id="user-name-global" placeholder="あなたの名前" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px;width:120px;">
  </div>

  <!-- Session list view -->
  <div id="list-view">
    <div class="header">
      <h1>練習レビュー</h1>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn primary" id="new-session-btn" onclick="toggleNewSessionPanel()">+ 新規セッション</button>
        <a class="back-btn" id="tasks-link" href="/tasks">タスク管理</a>
      </div>
    </div>
    <script>
      (function(){
        const gid = new URLSearchParams(location.search).get("group_id");
        if (gid) document.getElementById("tasks-link").href = "/tasks?group_id=" + encodeURIComponent(gid);
      })();
    </script>

    <!-- New session panel -->
    <div class="new-session-panel" id="new-session-panel">
      <h3>Google Driveから音声ファイルを選択</h3>
      <div id="drive-auth-msg" style="color:var(--text2);font-size:13px;margin-bottom:8px;display:none;">
        Google Driveにログインしてください
      </div>
      <div class="drive-breadcrumb" id="drive-breadcrumb"></div>
      <div class="drive-file-list" id="drive-file-list">
        <div class="loading">ファイル一覧を読み込み中...</div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <input type="text" id="new-session-title" placeholder="セッションタイトル (自動入力)" style="flex:1;min-width:200px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px;">
        <input type="date" id="new-session-date" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px;">
        <button class="btn primary" id="create-session-btn" onclick="createSessionFromDrive()" disabled>セッション作成 + 解析</button>
        <button class="btn" onclick="toggleNewSessionPanel()">キャンセル</button>
      </div>
      <div class="progress-container" id="progress-container">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-text" id="progress-text"></div>
      </div>
    </div>

    <div class="session-list" id="session-list">
      <div class="loading">読み込み中...</div>
    </div>
  </div>

  <!-- Player view -->
  <div id="player-view">
    <div class="player-header">
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn" onclick="showList()">&larr; 戻る</button>
        <h2 id="session-title"></h2>
      </div>
    </div>

    <div id="waveform"></div>

    <div class="transport">
      <button class="btn skip-btn" onclick="skip(-30)" title="-30s">-30</button>
      <button class="btn skip-btn" onclick="skip(-5)" title="-5s">-5</button>
      <button class="btn primary" id="play-btn" onclick="togglePlay()" style="width:48px;height:36px;font-size:14px;">&#9654;</button>
      <button class="btn skip-btn" onclick="skip(5)" title="+5s">+5</button>
      <button class="btn skip-btn" onclick="skip(30)" title="+30s">+30</button>
      <span class="time" id="current-time">0:00</span>
      <span style="color:var(--text2);font-size:13px;">/</span>
      <span class="time" id="total-time" style="color:var(--text2);">0:00</span>
      <span style="flex:1"></span>
      <label style="font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px;">
        速度
        <select id="speed-select" onchange="setSpeed(this.value)" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:2px 6px;border-radius:4px;font-size:12px;">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
        </select>
      </label>
    </div>

    <!-- Segments -->
    <div class="segments-section">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <h3 style="font-size:14px;color:var(--text2);margin:0;">セグメント（曲の区切り）</h3>
        <button class="btn" id="detect-segments-btn" onclick="detectSegmentsFromPlayer()" style="font-size:11px;padding:3px 8px;">自動検出</button>
      </div>
      <div id="segments-container"></div>
    </div>

    <!-- Annotations -->
    <div class="annotations-section">
      <h3>アノテーション</h3>
      <div id="annotations-container"></div>
      <div class="add-annotation">
        <input name="user_name" id="ann-user" placeholder="名前">
        <select id="ann-type">
          <option value="comment">コメント</option>
          <option value="good">良い!</option>
          <option value="issue">要改善</option>
        </select>
        <input name="content" id="ann-content" placeholder="メモを入力... (現在位置にタイムスタンプ)">
        <button class="btn primary" onclick="addAnnotation()">追加</button>
      </div>
    </div>

    <!-- Clip extraction (client-side) -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:20px;">
      <h3 style="font-size:14px;color:var(--text2);margin-bottom:8px;">切り抜きダウンロード</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <label style="font-size:13px;">開始:
          <input type="text" id="clip-start" placeholder="0:00" style="width:60px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:13px;">
        </label>
        <label style="font-size:13px;">終了:
          <input type="text" id="clip-end" placeholder="3:00" style="width:60px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:13px;">
        </label>
        <input type="text" id="clip-title" placeholder="ファイル名 (任意)" style="flex:1;min-width:120px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:4px;font-size:13px;">
        <button class="btn primary" onclick="downloadClip()">WAVダウンロード</button>
      </div>
    </div>
  </div>
</div>

<!-- WaveSurfer.js -->
<script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js" type="module"></script>
<script type="module">
import WaveSurfer from 'https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.esm.js';

const params = new URLSearchParams(location.search);
const GROUP_ID = params.get('group_id');
const API = '';
let wavesurfer = null;
let currentSession = null;
let gAccessToken = null;
let audioBuffer = null;  // Decoded audio for segment detection + clip extraction
let selectedDriveFile = null;

// Expose to global for onclick handlers
window._ws = { wavesurfer: null };

// ── Google Auth (GIS) ──
window.handleAuth = async function() {
  if (!window.google?.accounts?.oauth2) {
    alert('Google Identity Services が読み込まれていません。\nポップアップブロッカーを無効にしてください。');
    return;
  }
  const client = google.accounts.oauth2.initTokenClient({
    client_id: getClientId(),
    scope: 'https://www.googleapis.com/auth/drive.readonly',
    callback: (resp) => {
      if (resp.access_token) {
        gAccessToken = resp.access_token;
        document.getElementById('auth-status').textContent = 'Google Drive 接続済み';
        document.getElementById('auth-status').className = 'auth-status ok';
        document.getElementById('auth-btn').textContent = '再接続';
        localStorage.setItem('g_access_token', resp.access_token);
        // Refresh drive browser if open
        if (document.getElementById('new-session-panel').style.display === 'block') {
          browseDriveFolder('root');
        }
      }
    },
  });
  client.requestAccessToken();
};

function getClientId() {
  const meta = document.querySelector('meta[name="google-client-id"]');
  if (meta) return meta.content;
  return localStorage.getItem('google_client_id') || prompt('Google OAuth Client ID を入力してください:');
}

// Try restoring token
gAccessToken = localStorage.getItem('g_access_token');
if (gAccessToken) {
  document.getElementById('auth-status').textContent = 'Google Drive 接続済み (キャッシュ)';
  document.getElementById('auth-status').className = 'auth-status ok';
  document.getElementById('auth-btn').textContent = '再接続';
}

// Restore user name
const savedName = localStorage.getItem('practice_user_name');
if (savedName) document.getElementById('user-name-global').value = savedName;
document.getElementById('user-name-global').addEventListener('change', (e) => {
  localStorage.setItem('practice_user_name', e.target.value);
});

// ── Drive browser state ──
let driveFolderStack = []; // [{id, name}]

window.toggleNewSessionPanel = function() {
  const panel = document.getElementById('new-session-panel');
  if (panel.style.display === 'block') {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = 'block';
  selectedDriveFile = null;
  document.getElementById('create-session-btn').disabled = true;
  if (!gAccessToken) {
    document.getElementById('drive-auth-msg').style.display = 'block';
    document.getElementById('drive-file-list').innerHTML = '';
    return;
  }
  document.getElementById('drive-auth-msg').style.display = 'none';
  driveFolderStack = [{id: 'root', name: 'マイドライブ'}];
  browseDriveFolder('root');
};

async function browseDriveFolder(folderId) {
  const container = document.getElementById('drive-file-list');
  container.innerHTML = '<div class="loading">読み込み中...</div>';
  updateBreadcrumb();

  try {
    // List folders + audio files
    const q = `'${folderId}' in parents and trashed = false`;
    const fields = 'files(id,name,mimeType,size,modifiedTime)';
    const resp = await fetch(
      `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=${encodeURIComponent(fields)}&orderBy=name&pageSize=200`,
      { headers: { 'Authorization': `Bearer ${gAccessToken}` } }
    );
    if (!resp.ok) {
      if (resp.status === 401) {
        gAccessToken = null;
        localStorage.removeItem('g_access_token');
        container.innerHTML = '<div class="loading">トークン期限切れ — 再ログインしてください</div>';
        return;
      }
      throw new Error(`Drive API error: ${resp.status}`);
    }
    const data = await resp.json();
    const files = data.files || [];

    // Separate folders and audio files
    const folders = files.filter(f => f.mimeType === 'application/vnd.google-apps.folder');
    const audioFiles = files.filter(f =>
      f.mimeType?.startsWith('audio/') ||
      /\.(wav|mp3|m4a|flac|ogg|aac|wma)$/i.test(f.name)
    );

    if (folders.length === 0 && audioFiles.length === 0) {
      container.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:20px;text-align:center;">このフォルダには音声ファイルがありません</div>';
      return;
    }

    let html = '';
    for (const f of folders) {
      html += `<div class="drive-folder" onclick="enterDriveFolder('${f.id}', '${esc(f.name)}')">
        <span>📁</span> <span>${esc(f.name)}</span>
      </div>`;
    }
    for (const f of audioFiles) {
      const sizeMB = f.size ? (parseInt(f.size) / (1024*1024)).toFixed(0) + ' MB' : '';
      const date = f.modifiedTime ? new Date(f.modifiedTime).toLocaleDateString('ja-JP') : '';
      html += `<div class="drive-file" data-id="${f.id}" data-name="${esc(f.name)}" onclick="selectDriveFile('${f.id}', '${esc(f.name)}')">
        <span class="file-icon">🎵</span>
        <div class="file-info">
          <div class="file-name">${esc(f.name)}</div>
          <div class="file-meta">${date} ${sizeMB}</div>
        </div>
      </div>`;
    }
    container.innerHTML = html;
  } catch(e) {
    container.innerHTML = `<div class="loading">エラー: ${esc(e.message)}</div>`;
  }
}

function updateBreadcrumb() {
  const bc = document.getElementById('drive-breadcrumb');
  bc.innerHTML = driveFolderStack.map((f, i) => {
    if (i === driveFolderStack.length - 1) return `<span style="color:var(--text);cursor:default;">${esc(f.name)}</span>`;
    return `<span onclick="navigateBreadcrumb(${i})">${esc(f.name)}</span> <span style="cursor:default;color:var(--text2);">/</span>`;
  }).join(' ');
}

window.enterDriveFolder = function(id, name) {
  driveFolderStack.push({id, name});
  browseDriveFolder(id);
};

window.navigateBreadcrumb = function(index) {
  driveFolderStack = driveFolderStack.slice(0, index + 1);
  browseDriveFolder(driveFolderStack[index].id);
};

window.selectDriveFile = function(id, name) {
  // Deselect previous
  document.querySelectorAll('.drive-file').forEach(el => el.classList.remove('selected'));
  // Select new
  const el = document.querySelector(`.drive-file[data-id="${id}"]`);
  if (el) el.classList.add('selected');

  selectedDriveFile = { id, name };
  document.getElementById('create-session-btn').disabled = false;

  // Auto-fill title
  const titleInput = document.getElementById('new-session-title');
  if (!titleInput.value) {
    titleInput.value = name.replace(/\.(wav|mp3|m4a|flac|ogg|aac|wma)$/i, '');
  }
  // Try parse date from filename
  const dateInput = document.getElementById('new-session-date');
  if (!dateInput.value) {
    const m = name.match(/(\d{4})[-_](\d{2})[-_](\d{2})/);
    if (m) dateInput.value = `${m[1]}-${m[2]}-${m[3]}`;
  }
};

// ── Create session from Drive file ──
window.createSessionFromDrive = async function() {
  if (!selectedDriveFile || !gAccessToken) return;

  const title = document.getElementById('new-session-title').value.trim() || selectedDriveFile.name;
  const dateStr = document.getElementById('new-session-date').value;
  const btn = document.getElementById('create-session-btn');
  btn.disabled = true;
  btn.textContent = '処理中...';

  const progressContainer = document.getElementById('progress-container');
  const progressFill = document.getElementById('progress-fill');
  const progressText = document.getElementById('progress-text');
  progressContainer.style.display = 'block';

  try {
    // Step 1: Share file for web playback
    progressText.textContent = '音声ファイルをダウンロード中...';
    progressFill.style.width = '10%';

    // Step 2: Download audio for analysis
    const audioResp = await fetch(
      `https://www.googleapis.com/drive/v3/files/${selectedDriveFile.id}?alt=media`,
      { headers: { 'Authorization': `Bearer ${gAccessToken}` } }
    );
    if (!audioResp.ok) throw new Error(`Drive download failed: ${audioResp.status}`);
    const audioBlob = await audioResp.blob();
    if (audioBlob.size < 1000) throw new Error('ファイルが空または破損しています');
    progressFill.style.width = '40%';

    // Step 3: Decode audio
    progressText.textContent = '音声をデコード中...';
    const arrayBuf = await audioBlob.arrayBuffer();
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const decoded = await audioCtx.decodeAudioData(arrayBuf);
    audioCtx.close();
    const durationSec = decoded.duration;
    progressFill.style.width = '60%';

    // Step 4: Auto-detect segments
    progressText.textContent = 'セグメント自動検出中...';
    const segments = detectSegments(decoded);
    progressFill.style.width = '80%';

    // Step 5: Register session via API
    progressText.textContent = 'セッションを登録中...';
    const sessionResp = await fetch(`${API}/api/sessions`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        group_id: GROUP_ID,
        title: title,
        recorded_at: dateStr ? new Date(dateStr).toISOString() : null,
        duration_sec: durationSec,
        drive_file_id: selectedDriveFile.id,
        drive_mp3_id: null,
        status: 'processed',
      }),
    });
    if (!sessionResp.ok) {
      const errText = await sessionResp.text();
      throw new Error(`セッション登録失敗 (${sessionResp.status}): ${errText}`);
    }
    const sessionData = await sessionResp.json();

    // Step 6: Register segments
    if (segments.length > 0) {
      const segPayload = segments.map((seg, i) => ({
        track_number: i + 1,
        start_sec: seg.start,
        end_sec: seg.end,
        auto_detected: true,
      }));
      await fetch(`${API}/api/sessions/${sessionData.id}/segments`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(segPayload),
      });
    }

    progressFill.style.width = '100%';
    progressText.textContent = `完了! ${segments.length} セグメント検出`;

    // Refresh session list
    await loadSessions();

    // Reset form after a moment
    setTimeout(() => {
      document.getElementById('new-session-panel').style.display = 'none';
      progressContainer.style.display = 'none';
      progressFill.style.width = '0%';
      document.getElementById('new-session-title').value = '';
      document.getElementById('new-session-date').value = '';
      selectedDriveFile = null;
      btn.textContent = 'セッション作成 + 解析';
      btn.disabled = true;
    }, 1500);

  } catch(e) {
    progressText.textContent = `エラー: ${e.message}`;
    progressFill.style.width = '0%';
    btn.disabled = false;
    btn.textContent = 'セッション作成 + 解析';
  }
};

// ── Segment detection (client-side, same logic as Colab) ──
const DETECT_WINDOW_SEC = 0.5;
const DETECT_DROP_DB = 25.0;
const DETECT_MIN_LOW_SEC = 4.0;
const DETECT_MIN_TRACK_SEC = 60.0;
const DETECT_PAD_SEC = 0.5;

function detectSegments(decodedAudio) {
  // Downmix to mono
  const numChannels = decodedAudio.numberOfChannels;
  const length = decodedAudio.length;
  const sampleRate = decodedAudio.sampleRate;
  const mono = new Float32Array(length);

  for (let ch = 0; ch < numChannels; ch++) {
    const channelData = decodedAudio.getChannelData(ch);
    for (let i = 0; i < length; i++) {
      mono[i] += channelData[i] / numChannels;
    }
  }

  // Compute RMS envelope in dB
  const windowSamples = Math.floor(sampleRate * DETECT_WINDOW_SEC);
  const numWindows = Math.floor(length / windowSamples);
  if (numWindows === 0) return [{start: 0, end: decodedAudio.duration}];

  const rmsDb = new Float32Array(numWindows);
  for (let w = 0; w < numWindows; w++) {
    const offset = w * windowSamples;
    let sum = 0;
    for (let i = 0; i < windowSamples; i++) {
      const s = mono[offset + i];
      sum += s * s;
    }
    const rms = Math.sqrt(sum / windowSamples);
    rmsDb[w] = 20 * Math.log10(rms + 1e-10);
  }

  // Overall mean
  let meanDb = 0;
  for (let i = 0; i < numWindows; i++) meanDb += rmsDb[i];
  meanDb /= numWindows;

  // Find low regions
  const threshold = meanDb - DETECT_DROP_DB;
  const lowRegions = [];
  let inLow = false, lowStart = 0;
  for (let i = 0; i < numWindows; i++) {
    if (rmsDb[i] < threshold && !inLow) {
      lowStart = i;
      inLow = true;
    } else if (rmsDb[i] >= threshold && inLow) {
      if ((i - lowStart) * DETECT_WINDOW_SEC >= DETECT_MIN_LOW_SEC) {
        lowRegions.push({start: lowStart * DETECT_WINDOW_SEC, end: i * DETECT_WINDOW_SEC});
      }
      inLow = false;
    }
  }
  if (inLow && (numWindows - lowStart) * DETECT_WINDOW_SEC >= DETECT_MIN_LOW_SEC) {
    lowRegions.push({start: lowStart * DETECT_WINDOW_SEC, end: numWindows * DETECT_WINDOW_SEC});
  }

  const totalDur = decodedAudio.duration;
  if (lowRegions.length === 0) return [{start: 0, end: totalDur}];

  // Split at midpoints of low regions
  const splits = lowRegions.map(r => (r.start + r.end) / 2);
  const bounds = [0, ...splits, totalDur];
  let raw = [];
  for (let i = 0; i < bounds.length - 1; i++) {
    raw.push({start: bounds[i], end: bounds[i+1]});
  }

  // Merge short segments
  let merged = [];
  for (const seg of raw) {
    if (merged.length > 0 && (merged[merged.length-1].end - merged[merged.length-1].start) < DETECT_MIN_TRACK_SEC) {
      merged[merged.length-1].end = seg.end;
    } else {
      merged.push({...seg});
    }
  }
  if (merged.length > 1 && (merged[merged.length-1].end - merged[merged.length-1].start) < DETECT_MIN_TRACK_SEC) {
    merged[merged.length-2].end = merged[merged.length-1].end;
    merged.pop();
  }

  // Apply padding
  const padded = [];
  for (let i = 0; i < merged.length; i++) {
    const ps = i > 0 ? merged[i].start + DETECT_PAD_SEC : merged[i].start;
    const pe = i < merged.length - 1 ? merged[i].end - DETECT_PAD_SEC : merged[i].end;
    if (pe > ps) padded.push({start: ps, end: pe});
  }

  return padded;
}

// ── Detect segments from player view (re-analyze loaded audio) ──
window.detectSegmentsFromPlayer = async function() {
  if (!audioBuffer) {
    alert('音声が読み込まれていません');
    return;
  }
  if (!currentSession) return;

  const btn = document.getElementById('detect-segments-btn');
  btn.disabled = true;
  btn.textContent = '検出中...';

  try {
    const segments = detectSegments(audioBuffer);
    if (segments.length === 0) {
      alert('セグメントが検出されませんでした');
      return;
    }

    // Register via API
    const segPayload = segments.map((seg, i) => ({
      track_number: i + 1,
      start_sec: seg.start,
      end_sec: seg.end,
      auto_detected: true,
    }));
    const resp = await fetch(`${API}/api/sessions/${currentSession.id}/segments`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(segPayload),
    });
    const result = await resp.json();

    // Update local state and re-render
    currentSession.segments = result.map((r, i) => ({
      id: r.id,
      track_number: r.track_number,
      title: null,
      start_sec: segments[i].start,
      end_sec: segments[i].end,
      auto_detected: true,
    }));
    renderSegments(currentSession.segments);
    alert(`${segments.length} セグメントを検出・登録しました`);
  } finally {
    btn.disabled = false;
    btn.textContent = '自動検出';
  }
};

// ── Session list ──
async function loadSessions() {
  const container = document.getElementById('session-list');
  try {
    const resp = await fetch(`${API}/api/sessions?group_id=${GROUP_ID}`);
    const sessions = await resp.json();
    if (!sessions.length) {
      container.innerHTML = '<div class="loading">練習セッションがありません。<br>「+ 新規セッション」からGoogle Driveの録音を追加してください。</div>';
      return;
    }
    container.innerHTML = sessions.map(s => {
      const dur = s.duration_sec ? `${Math.floor(s.duration_sec/60)}分` : '';
      const date = s.recorded_at ? new Date(s.recorded_at).toLocaleDateString('ja-JP') : '';
      return `<div class="session-card" onclick="openSession(${s.id})">
        <span class="title">${esc(s.title)}</span>
        <span class="status ${s.status}">${s.status}</span>
        <div class="meta">${date} ${dur}</div>
      </div>`;
    }).join('');
  } catch(e) {
    container.innerHTML = `<div class="loading">読み込みエラー: ${e.message}</div>`;
  }
}

window.openSession = async function(id) {
  document.getElementById('list-view').style.display = 'none';
  document.getElementById('player-view').style.display = 'block';

  try {
    const resp = await fetch(`${API}/api/sessions/${id}`);
    currentSession = await resp.json();
    document.getElementById('session-title').textContent = currentSession.title;
    renderSegments(currentSession.segments);
    renderAnnotations(currentSession.annotations);

    // Load audio (prefer mp3, fallback to original)
    const driveId = currentSession.drive_mp3_id || currentSession.drive_file_id;
    if (driveId) {
      await loadAudio(driveId);
    }
  } catch(e) {
    alert('セッション読み込みエラー: ' + e.message);
  }
};

window.showList = function() {
  document.getElementById('list-view').style.display = 'block';
  document.getElementById('player-view').style.display = 'none';
  if (wavesurfer) { wavesurfer.destroy(); wavesurfer = null; window._ws.wavesurfer = null; }
  audioBuffer = null;
};

// ── Audio loading from Google Drive ──
async function loadAudio(driveFileId) {
  if (!gAccessToken) {
    document.getElementById('waveform').innerHTML = '<div class="loading">Google Driveにログインしてから音声を再生できます</div>';
    return;
  }

  document.getElementById('waveform').innerHTML = '<div class="loading">音声読み込み中...</div>';

  try {
    const resp = await fetch(
      `https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`,
      { headers: { 'Authorization': `Bearer ${gAccessToken}` } }
    );
    if (!resp.ok) {
      if (resp.status === 401) {
        gAccessToken = null;
        localStorage.removeItem('g_access_token');
        document.getElementById('auth-status').textContent = 'トークン期限切れ — 再ログインしてください';
        document.getElementById('auth-status').className = 'auth-status';
      }
      throw new Error(`Drive API error: ${resp.status}`);
    }
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);

    // Also decode for segment detection + clip extraction
    try {
      const arrBuf = await blob.arrayBuffer();
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      audioBuffer = await ctx.decodeAudioData(arrBuf);
      ctx.close();
    } catch(decodeErr) {
      console.warn('Audio decode for analysis failed:', decodeErr);
      audioBuffer = null;
    }

    document.getElementById('waveform').innerHTML = '';

    if (wavesurfer) wavesurfer.destroy();
    wavesurfer = WaveSurfer.create({
      container: '#waveform',
      waveColor: '#4a5568',
      progressColor: '#4fc3f7',
      cursorColor: '#4fc3f7',
      height: 100,
      barWidth: 2,
      barGap: 1,
      barRadius: 2,
      url: url,
    });

    window._ws.wavesurfer = wavesurfer;

    wavesurfer.on('ready', () => {
      document.getElementById('total-time').textContent = fmtTime(wavesurfer.getDuration());
    });
    wavesurfer.on('timeupdate', (t) => {
      document.getElementById('current-time').textContent = fmtTime(t);
    });
    wavesurfer.on('play', () => {
      document.getElementById('play-btn').innerHTML = '&#9646;&#9646;';
    });
    wavesurfer.on('pause', () => {
      document.getElementById('play-btn').innerHTML = '&#9654;';
    });
  } catch(e) {
    document.getElementById('waveform').innerHTML = `<div class="loading">音声読み込みエラー: ${esc(e.message)}</div>`;
  }
}

// ── Transport ──
window.togglePlay = function() { if (wavesurfer) wavesurfer.playPause(); };
window.skip = function(sec) {
  if (!wavesurfer) return;
  const t = wavesurfer.getCurrentTime() + sec;
  wavesurfer.seekTo(Math.max(0, Math.min(t, wavesurfer.getDuration())) / wavesurfer.getDuration());
};
window.setSpeed = function(rate) { if (wavesurfer) wavesurfer.setPlaybackRate(parseFloat(rate)); };
window.seekTo = function(sec) {
  if (!wavesurfer) return;
  wavesurfer.seekTo(Math.max(0, sec) / wavesurfer.getDuration());
};

// ── Segments ──
function renderSegments(segments) {
  const c = document.getElementById('segments-container');
  if (!segments || !segments.length) {
    c.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:8px;">セグメント未検出 — 「自動検出」で曲の区切りを検出できます</div>';
    return;
  }
  c.innerHTML = segments.map(sg => {
    const dur = sg.end_sec - sg.start_sec;
    return `<div class="segment-row" onclick="seekTo(${sg.start_sec})" data-id="${sg.id}">
      <span class="num">#${sg.track_number}</span>
      <span class="seg-title">
        <input value="${esc(sg.title || '')}" placeholder="曲名を入力..."
               onclick="event.stopPropagation()"
               onchange="updateSegmentTitle(${sg.id}, this.value)">
      </span>
      <span class="seg-time">${fmtTime(sg.start_sec)} - ${fmtTime(sg.end_sec)} (${Math.floor(dur/60)}:${String(Math.floor(dur%60)).padStart(2,'0')})</span>
    </div>`;
  }).join('');
}

window.updateSegmentTitle = async function(id, title) {
  await fetch(`${API}/api/segments/${id}`, {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({title}),
  });
};

// ── Annotations ──
function renderAnnotations(annotations) {
  const c = document.getElementById('annotations-container');
  if (!annotations || !annotations.length) {
    c.innerHTML = '<div style="color:var(--text2);font-size:13px;padding:8px;">まだアノテーションがありません</div>';
    return;
  }
  c.innerHTML = annotations.map(a => `
    <div class="annotation ${a.annotation_type}">
      <span class="ann-time" onclick="seekTo(${a.timestamp_sec})">${fmtTime(a.timestamp_sec)}</span>
      <div class="ann-body">
        <span class="ann-user">${esc(a.user_name)}</span>
        <div class="ann-content">${esc(a.content)}</div>
      </div>
      <span class="ann-delete" onclick="deleteAnnotation(${a.id})">&times;</span>
    </div>
  `).join('');
}

window.addAnnotation = async function() {
  if (!currentSession) return;
  const userName = document.getElementById('ann-user').value.trim()
                   || document.getElementById('user-name-global').value.trim();
  const content = document.getElementById('ann-content').value.trim();
  if (!userName || !content) { alert('名前とメモを入力してください'); return; }

  const timestampSec = wavesurfer ? wavesurfer.getCurrentTime() : 0;

  const resp = await fetch(`${API}/api/sessions/${currentSession.id}/annotations`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      user_name: userName,
      content: content,
      timestamp_sec: timestampSec,
      annotation_type: document.getElementById('ann-type').value,
    }),
  });
  const ann = await resp.json();
  currentSession.annotations.push(ann);
  currentSession.annotations.sort((a,b) => a.timestamp_sec - b.timestamp_sec);
  renderAnnotations(currentSession.annotations);
  document.getElementById('ann-content').value = '';
  document.getElementById('ann-user').value = userName;
  localStorage.setItem('practice_user_name', userName);
};

window.deleteAnnotation = async function(id) {
  await fetch(`${API}/api/annotations/${id}`, {method: 'DELETE'});
  currentSession.annotations = currentSession.annotations.filter(a => a.id !== id);
  renderAnnotations(currentSession.annotations);
};

// ── Client-side clip extraction (WAV download) ──
window.downloadClip = function() {
  if (!audioBuffer) {
    alert('音声が読み込まれていません');
    return;
  }
  const startSec = parseTime(document.getElementById('clip-start').value);
  const endSec = parseTime(document.getElementById('clip-end').value);
  if (startSec === null || endSec === null || endSec <= startSec) {
    alert('開始・終了時間を正しく入力してください (例: 1:30)');
    return;
  }

  const title = document.getElementById('clip-title').value.trim() || 'clip';
  const sampleRate = audioBuffer.sampleRate;
  const numChannels = audioBuffer.numberOfChannels;
  const startSample = Math.floor(startSec * sampleRate);
  const endSample = Math.min(Math.floor(endSec * sampleRate), audioBuffer.length);
  const clipLength = endSample - startSample;

  if (clipLength <= 0) {
    alert('範囲が無効です');
    return;
  }

  // Extract channel data
  const channels = [];
  for (let ch = 0; ch < numChannels; ch++) {
    const full = audioBuffer.getChannelData(ch);
    channels.push(full.slice(startSample, endSample));
  }

  // Encode to WAV
  const wavBlob = encodeWav(channels, sampleRate);
  const url = URL.createObjectURL(wavBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${title}.wav`;
  a.click();
  URL.revokeObjectURL(url);
};

function encodeWav(channels, sampleRate) {
  const numChannels = channels.length;
  const length = channels[0].length;
  const bytesPerSample = 2; // 16-bit
  const blockAlign = numChannels * bytesPerSample;
  const dataSize = length * blockAlign;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  // RIFF header
  writeString(view, 0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(view, 8, 'WAVE');

  // fmt chunk
  writeString(view, 12, 'fmt ');
  view.setUint32(16, 16, true); // chunk size
  view.setUint16(20, 1, true);  // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bytesPerSample * 8, true);

  // data chunk
  writeString(view, 36, 'data');
  view.setUint32(40, dataSize, true);

  // Interleave and write samples
  let offset = 44;
  for (let i = 0; i < length; i++) {
    for (let ch = 0; ch < numChannels; ch++) {
      const sample = Math.max(-1, Math.min(1, channels[ch][i]));
      view.setInt16(offset, sample * 0x7FFF, true);
      offset += 2;
    }
  }

  return new Blob([buffer], {type: 'audio/wav'});
}

function writeString(view, offset, str) {
  for (let i = 0; i < str.length; i++) {
    view.setUint8(offset + i, str.charCodeAt(i));
  }
}

// ── Helpers ──
function fmtTime(sec) {
  if (sec == null || isNaN(sec)) return '0:00';
  const s = Math.floor(sec);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  if (h > 0) return `${h}:${String(m%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  return `${m}:${String(s%60).padStart(2,'0')}`;
}

function parseTime(str) {
  if (!str) return null;
  const parts = str.split(':').map(Number);
  if (parts.some(isNaN)) return null;
  if (parts.length === 3) return parts[0]*3600 + parts[1]*60 + parts[2];
  if (parts.length === 2) return parts[0]*60 + parts[1];
  return parts[0];
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowLeft') { e.preventDefault(); skip(e.shiftKey ? -30 : -5); }
  if (e.code === 'ArrowRight') { e.preventDefault(); skip(e.shiftKey ? 30 : 5); }
});

// ── Init ──
loadSessions();
</script>
